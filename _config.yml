title: "Cloud Advisor Agent"
description: "GitHub Copilot custom agent (@cloud-advisor) — Microsoft Cloud & Azure expert advisory with live MCP context, cost calculators, hub-spoke architecture, and presentation generation."
baseurl: "/Cloud-Advisor-Agent"
url: "https://ibranibeny.github.io"

remote_theme: just-the-docs/just-the-docs@v0.10.0

color_scheme: light
search_enabled: true
search.button: true

heading_anchors: true
permalink: pretty

aux_links:
  "GitHub Repo":
    - "https://github.com/ibranibeny/Cloud-Advisor-Agent"

aux_links_new_tab: true

nav_sort: case_insensitive
back_to_top: true
back_to_top_text: "Back to top"

footer_content: "Cloud Advisor Agent &mdash; by Ben Yibrani"

exclude:
  - skills/
  - templates/
  - output/
  - specs/
  - "*.py"
  - "*.sh"
  - Gemfile
  - Gemfile.lock

mermaid:
  version: "11"

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: yellow
